<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunog Pinoy - Contact Us</title>
    <link rel="icon" type="image/png" href="images/tab.png">
    
    <link rel="stylesheet" href="css/design.css">
    
    <style>
        body {
            padding-top: 80px; 
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* --- Main Content Layout --- */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 40px; 
            max-width: 1200px; 
            margin: 40px auto 100px auto; 
            padding: 0 40px; 
        }

        .contact-info {
            text-align: left;
            padding-top: 20px; 
        }

        .suggestion-box {
            text-align: right;
            padding-top: 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
        }

        .contact-detail {
            font-size: 20px;
            line-height: 0.5em;
        }

        .suggestion-text {
            font-size: 32px;
            font-weight: bold;
            line-height: 1.3;
        }

        .local-highlight {
            font-style: italic;
        }

        /* --- TABLET VIEW (landscape) --- */
        @media (min-width: 769px) and (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr 1fr;
                gap: 30px;
                padding: 0 30px;
            }

            body {
                padding-top: 100px;
            }
        }

        /* --- MOBILE VIEW (portrait) --- */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 0 20px;
            }

            .suggestion-box {
                text-align: left; 
            }

            body {
                padding-top: 140px; /* more space for fixed header + nav */
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <a href="index.html">
            <img src="images/logo.png" alt="logo" id="logo">
            </a>
        </div>

        <section class="navbar">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="instruments.html">Instruments</a>
                <a href="aboutus.html">About Us</a>
                <a href="#"><strong>Contact Us</strong></a>
            </div>
        </section>
    </header>

    <main class="main-content">

        <section class="contact-info">
            <h1 class="section-title">
                Contact the Creator via:
            </h1>
            <p class="contact-detail">
                Cellphone: 0921-552-4285
            </p>
            <p class="contact-detail">
                Email: <a href="mailto:villanuevapao13@gmail.com" class="email-link">villanuevapao13@gmail.com</a>
            </p>
        </section>

        <section class="suggestion-box">
            <h2 class="suggestion-text">
                Suggest <span class="local-highlight">local</span><br>instruments to review. <br>Reach out to us!
            </h2>
        </section>

    </main>

    <footer class="footer">
        Created by Paolo Villanueva est. 2025
    </footer>

</body>
</html>
