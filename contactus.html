<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunog Pinoy - Contact Us</title>
    
    <link rel="stylesheet" href="css/design.css">
    
    <style>
        /* --- GLOBAL HEADER STYLING (Applies to all screens) --- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100; 
            background-color: #e6e0d3; 
            opacity: 1; 
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); 
            
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px; 
        }
        
        body {
            padding-top: 80px; 
        }
        
        .nav-links {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
        }

        /* --- Main Content Layout --- */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 40px; 
            max-width: 1200px; 
            margin: 40px auto 100px auto; 
            padding: 0 40px; 
        }

        .contact-info {
            text-align: left;
            padding-top: 20px; 
        }

        .suggestion-box {
            text-align: right;
            padding-top: 20px;
        }

        .section-title{
            font-size: 24px;
            font-weight: bold;
        }

        .contact-detail {
            font-size: 20px;
            line-height: 0.5em;
        }

        .suggestion-text {
            font-size: 32px;
            font-weight: bold;
            line-height: 1.3;
        }

        .local-highlight {
            font-style: italic;
        }
        
        /* --- TABLET/MOBILE VIEW --- */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 0 20px;
            }
            .suggestion-box {
                text-align: left; 
            }
            
            /* Mobile Nav Left, Logo Right */
            .header {
                flex-direction: row;
                align-items: flex-start;
                padding: 10px 20px;
            }
            .logo-container {
                order: 2; 
                text-align: right; 
            }
            .nav-links {
                order: 1; 
                flex-direction: column; 
                gap: 5px;
                align-items: flex-start; 
            }
            .nav-links a {
                padding: 5px 0;
                width: auto; 
                text-align: left; 
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="placeholder-logo.png" alt="logo" id="logo">
        </div>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="instruments.html">Instruments</a>
            <a href="aboutus.html">About Us</a>
            <a href="#"><strong>Contact Us</strong></a>
        </div>
    </header>

    <main class="main-content">

        <section class="contact-info">
            <h1 class="section-title">
                Contact the Creator via:
            </h1>
            <p class="contact-detail">
                Cellphone: 0921-552-4285
            </p>
            <p class="contact-detail">
                Email: <a href="mailto:villanuevapao13@gmail.com" class="email-link">villanuevapao13@gmail.com</a>
            </p>
        </section>

        <section class="suggestion-box">
            <h2 class="suggestion-text">
                Suggest <span class="local-highlight">local</span><br>instruments to review. <br>Reach out to us!
            </h2>
        </section>

    </main>

    <footer class="footer">
        Created by Paolo Villanueva est. 2025
    </footer>

</body>
</html>
